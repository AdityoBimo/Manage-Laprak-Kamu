<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Laprak Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>

  <body>
    <main class="container">
      <header>
        <div>
          <h1>Di <mark>Laprakin</mark> aja</h1>
          <p>Pantau progres laporan praktikum kamu selama satu semester.</p>
        </div>
        <div class="header-actions">
          <div class="segmented" role="group" aria-label="Mode tampilan">
            <button
              type="button"
              class="seg"
              data-theme="light"
              aria-pressed="false"
            >
              Light
            </button>
            <button
              type="button"
              class="seg"
              data-theme="dark"
              aria-pressed="false"
            >
              Dark
            </button>
          </div>

          <div class="dropdown" id="paletteDropdown">
            <button
              type="button"
              class="secondary dd-button"
              id="paletteButton"
              aria-haspopup="listbox"
              aria-expanded="false"
              aria-label="Pilih warna"
            >
              <span class="dot"></span>
              <span id="paletteLabel">Hijau</span>
              <span class="caret" aria-hidden="true"></span>
            </button>
            <div
              class="dd-menu"
              id="paletteMenu"
              role="listbox"
              aria-label="Warna"
              hidden
            >
              <button
                type="button"
                role="option"
                class="dd-item"
                data-palette="hijau"
                data-label="Hijau"
                style="--sw: #3d8b78"
                aria-selected="false"
              >
                <span class="dot"></span>Hijau
              </button>
              <button
                type="button"
                role="option"
                class="dd-item"
                data-palette="biru"
                data-label="Biru"
                style="--sw: #3b6fd4"
                aria-selected="false"
              >
                <span class="dot"></span>Biru
              </button>
              <button
                type="button"
                role="option"
                class="dd-item"
                data-palette="ungu"
                data-label="Ungu"
                style="--sw: #6c5ce7"
                aria-selected="false"
              >
                <span class="dot"></span>Ungu
              </button>
              <button
                type="button"
                role="option"
                class="dd-item"
                data-palette="pink"
                data-label="Pink"
                style="--sw: #d6457a"
                aria-selected="false"
              >
                <span class="dot"></span>Pink
              </button>
              <button
                type="button"
                role="option"
                class="dd-item"
                data-palette="oranye"
                data-label="Oranye"
                style="--sw: #d9731f"
                aria-selected="false"
              >
                <span class="dot"></span>Oranye
              </button>
            </div>
          </div>
        </div>
      </header>

      <section class="stats">
        <div class="stat">
          <span class="muted">Mata kuliah</span>
          <strong id="courseCount">0</strong>
        </div>
        <div class="stat">
          <span class="muted">Pertemuan selesai</span>
          <strong id="doneCount">0/0</strong>
        </div>
        <div class="stat">
          <span class="muted">Progres keseluruhan</span>
          <strong id="overallProgress">0%</strong>
        </div>
      </section>

      <section>
        <div class="toolbar">
          <div>
            <h2>Praktikum yang di tambahkan</h2>
            <span class="muted">Checklist setiap pertemuan praktikum.</span>
          </div>
          <button id="addButton">+ Tambah matkul</button>
        </div>

        <div class="course-list" id="courseList"></div>
      </section>
    </main>

    <!-- Modal tambah/edit mata kuliah -->
    <div class="modal-backdrop" id="courseModal">
      <div class="modal">
        <h2 id="courseModalTitle">Tambah mata kuliah</h2>

        <form id="courseForm">
          <div class="field">
            <label for="courseName">Nama mata kuliah</label>
            <input
              id="courseName"
              type="text"
              autocomplete="off"
              placeholder="Contoh: Praktikum Basis Data"
              required
            />
          </div>

          <div class="field">
            <label for="meetingCount">Jumlah pertemuan</label>
            <input
              id="meetingCount"
              type="number"
              min="1"
              max="100"
              value="14"
              required
            />
          </div>

          <div class="field">
            <label for="submitLink">Link pengumpulan (opsional)</label>
            <input
              id="submitLink"
              type="text"
              inputmode="url"
              autocomplete="off"
              placeholder="Contoh: link Google Form dari asprak"
            />
          </div>

          <div class="modal-actions">
            <button type="button" class="secondary" id="cancelCourse">
              Batal
            </button>
            <button type="submit">Simpan</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Modal checklist pertemuan -->
    <div class="modal-backdrop" id="meetingModal">
      <div class="modal">
        <h2 id="meetingTitle">Checklist pertemuan</h2>
        <p id="meetingSummary" class="muted"></p>
        <p id="storageInfo" class="muted"></p>
        <input
          type="file"
          id="fileInput"
          multiple
          hidden
          accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.txt,.zip,.rar,.png,.jpg,.jpeg"
        />

        <div class="meeting-list" id="meetingList"></div>

        <div class="modal-actions">
          <button type="button" class="secondary" id="markAll">
            Tandai semua
          </button>
          <button type="button" class="secondary" id="closeMeeting">
            Tutup
          </button>
          <button type="button" id="doneMeeting">Done</button>
        </div>
      </div>
    </div>
  </body>
</html>
